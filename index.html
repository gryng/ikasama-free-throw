<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>イカサマフリースロー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=M+PLUS+1p:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#040907;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#nameModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);z-index:10;touch-action:auto}
#nameModal .box{width:min(300px,84vw);background:linear-gradient(#1f4a38,#08160f);border:2px solid #C9A84C;border-radius:16px;padding:20px 18px 16px;text-align:center;box-shadow:0 0 30px rgba(201,168,76,.35)}
#nameModal .ttl{font-family:"Dela Gothic One",sans-serif;color:#f3d27a;font-size:20px;margin-bottom:4px}
#nameModal .sub{font-family:"M PLUS 1p",sans-serif;font-weight:700;color:rgba(255,255,255,.65);font-size:12px;margin-bottom:12px}
#nameModal input{width:100%;box-sizing:border-box;font-family:"M PLUS 1p",sans-serif;font-weight:900;font-size:18px;padding:10px 12px;border-radius:10px;border:1.5px solid #C9A84C;background:rgba(0,0,0,.45);color:#fff;outline:none;-webkit-user-select:text;user-select:text;text-align:center}
#nameModal .row{display:flex;gap:10px;margin-top:14px}
#nameModal button{flex:1;font-family:"Dela Gothic One",sans-serif;font-size:16px;padding:10px 0;border-radius:999px;border:1.5px solid #C9A84C;cursor:pointer}
#nameModal .ok{background:linear-gradient(#fff1bf,#C9A84C 55%,#8a6a1f);color:#1a1205}
#nameModal .cancel{background:rgba(0,0,0,.4);color:#fff6d6}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="nameModal"><div class="box">
  <div class="ttl" id="nameTtl">なまえを登録</div>
  <div class="sub" id="nameSub">ランキングに表示されます（10文字まで）</div>
  <input id="nameInput" maxlength="10" autocomplete="off" enterkeyhint="done">
  <div class="row"><button class="cancel" id="nameCancel">やめる</button><button class="ok" id="nameOk">決定</button></div>
</div></div>
<script>
const VERSION = 'v0.9.1';
const W = 360, H = 640;
const F_JP = '"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif';
const F_NUM = '"Bebas Neue","Dela Gothic One",Impact,sans-serif';
const F_UI = '"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif';
const GOLD = '#C9A84C', GREEN = '#1B4332';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

// ===== フォント読み込み =====
let fontsReady = false;
(function () {
  const jp = 'イカサマフリースローゴールをドラッグ上にックしてシュートスの間に動かせ外たらおまい実力で入った!?ナイスバンクショットミスコア本連続成功最大ライフタップでスタートもう一回見習い凄腕伝説ペテン師駆け出し名人神手品ゲームオーバー称号タイム決めると×';
  const loads = document.fonts ? [
    document.fonts.load(`40px "Dela Gothic One"`, jp),
    document.fonts.load(`40px "Bebas Neue"`, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!×+'),
    document.fonts.load(`900 14px "M PLUS 1p"`, jp),
    document.fonts.load(`700 14px "M PLUS 1p"`, jp),
  ] : [];
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 3000))]).catch(() => {}).then(() => { fontsReady = true; });
})();

// ===== 世界（単位：メートル）=====
const G = 9.8, R_BALL = 0.12, RIM_R = 0.23, RIM_Z = 4.2, TUBE = 0.012;
const DEF_Y = 3.05;
const BOARD_Z = RIM_Z + RIM_R + 0.15, BOARD_DY0 = -0.15, BOARD_DY1 = 0.9, BOARD_X = 0.9;
const POLE_Z = BOARD_Z + 1.1, BASE_Z = RIM_Z + 1.6;
const HOOP_X = 2.2, HOOP_Y0 = 1.5, HOOP_Y1 = 4.5;
const REL = { x: 0, y: 2.1, z: 0 };
const ANG = 52 * Math.PI / 180;
const VSTAR = Math.sqrt(G * RIM_Z * RIM_Z / (2 * Math.cos(ANG) ** 2 * (RIM_Z * Math.tan(ANG) - (DEF_Y - REL.y))));
const CAM = { y: 2.45, z: -3 }, FOC = 700, HOR = H * 0.47;
const SLOW_SCALE = 0.18, MAX_LIFE = 3, ASSIST = 8, ASSIST_R = 0.45;
function proj(x, y, z) { const d = Math.max(0.05, z - CAM.z); return { x: W / 2 + FOC * x / d, y: HOR - FOC * (y - CAM.y) / d, s: FOC / d }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

// ===== サウンド =====
let AC = null, master = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0, attack = 0.005) {
  if (!AC) return; const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, vol, fq, type = 'bandpass', q = 0.8, toFq = 0, attack = 0.005, delay = 0) {
  if (!AC) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(fq, t0);
  if (toFq) f.frequency.exponentialRampToValueAtTime(toFq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f).connect(g).connect(master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05);
}
const SFX = {
  tap() { tone(1200, 0.05, 'square', 0.04); tone(1800, 0.06, 'sine', 0.05, 0, 0.03); },
  shoot() { noise(0.35, 0.35, 400, 'bandpass', 1.2, 3000, 0.04); },
  slowIn() { tone(320, 0.9, 'sawtooth', 0.07, 0.18); tone(160, 1.0, 'sine', 0.25, 0.3); noise(0.8, 0.25, 3000, 'bandpass', 1, 200, 0.01); tone(1568, 0.5, 'triangle', 0.06, 0, 0.05); },
  slowOut() { tone(110, 0.35, 'sine', 0.2, 3); noise(0.3, 0.2, 300, 'bandpass', 1, 4000, 0.02); },
  beat() { tone(70, 0.15, 'sine', 0.35, 0.6); tone(62, 0.15, 'sine', 0.25, 0.6, 0.16); },
  tick() { tone(2400, 0.03, 'square', 0.03); },
  rim(p) { const v = Math.min(0.22, 0.04 + p * 0.04); tone(520, 0.4, 'triangle', v); tone(1340, 0.25, 'sine', v * 0.5); tone(2100, 0.15, 'sine', v * 0.25); },
  board(p) { tone(150, 0.18, 'sine', Math.min(0.3, 0.08 + p * 0.04), 0.6); noise(0.06, 0.15, 900); },
  floor() { tone(95, 0.12, 'sine', 0.28, 0.5); },
  swish() { noise(0.35, 0.5, 4200, 'bandpass', 0.7, 2500); },
  impact() { tone(130, 0.45, 'sine', 0.45, 0.3); noise(0.25, 0.25, 2000, 'lowpass', 0.5, 200); },
  make(mult) { const base = 523 * Math.pow(1.06, Math.min(mult - 1, 6)); [1, 1.26, 1.5, 2].forEach((r, i) => tone(base * r, 0.25, 'triangle', 0.09, 0, i * 0.06)); },
  cheer(k = 1) { noise(1.8, 0.22 * k, 1100, 'bandpass', 0.4, 0, 0.25); noise(1.4, 0.1 * k, 2600, 'bandpass', 0.6, 0, 0.15, 0.05); },
  honest() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => { tone(f, 0.3, 'triangle', 0.1, 0, i * 0.07); tone(f * 2, 0.2, 'sine', 0.04, 0, i * 0.07 + 0.02); }); },
  miss() { tone(220, 0.5, 'sawtooth', 0.09, 0.45); tone(233, 0.5, 'sawtooth', 0.06, 0.45); noise(0.3, 0.2, 600, 'lowpass', 0.5); },
  lifeLost() { tone(880, 0.12, 'square', 0.05); tone(440, 0.3, 'square', 0.05, 0.5, 0.1); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.5, 'sawtooth', 0.07, 0, i * 0.18)); tone(55, 1.4, 'sine', 0.3, 0.5, 0.7); },
  record() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, 0, i * 0.09)); SFX.cheer(1.2); },
};

// ===== 状態 =====
let state = 'title', score = 0, makes = 0, combo = 0, maxCombo = 0, best = 0, isNew = false, ball = null, lives = MAX_LIFE;
let time = 0, wTime = 0, overT = 0, netAnim = 0, cheer = 0, shake = 0, lastHit = 0;
let tScale = 1, slowLeft = 0, slowDur = 0, slowUsed = false, slowStartT = -9, beatT = 0, tickT = 0;
let hitstop = 0, flash = { a: 0, c: '#fff' }, punch = 0, scoreDisp = 0, scoreBump = 0;
const hoop = { x: 0, y: DEF_Y, moved: 0 };
let flick = null, drag = null;
let msgs = [], parts = [], hudParts = [], trail = [], camFlashes = [], lifeAnim = [0, 0, 0];
try { best = +localStorage.getItem('ikasama_ft_best') || 0; } catch (e) {}

// 観客席：ゴールの奥にすり鉢状にせり上がる階段席（奥ほど高く、小さく、暗く）
const crowd = [], tiers = [];
(function () {
  const cols = [[45,106,79],[64,145,108],[201,168,76],[216,243,220],[149,213,178],[82,121,111],[233,196,106],[231,111,81],[230,230,230],[40,60,90]];
  const fogC = [8, 24, 17];
  const Z0 = 12, Z1 = 42, DZ = 0.95, RAKE = 0.68;
  for (let z = Z0, row = 0; z <= Z1; z += DZ, row++) {
    const yt = 0.3 + (z - Z0) * RAKE, half = 7 + (z - Z0) * 0.32, fog = Math.min(0.82, (z - Z0) / (Z1 - Z0) * 0.9);
    const L = proj(-half - 3, yt, z), R = proj(half + 3, yt, z), T = proj(0, yt + RAKE * DZ, z + DZ);
    tiers.push({ y: L.y, top: T.y, x0: L.x, x1: R.x, fog });
    for (let x = -half + (row % 2) * 0.28; x <= half; x += 0.56) {
      if (Math.abs(((x + 40) % 6.5) - 3.25) < 0.45) continue;      // 通路
      if (Math.random() < 0.06) continue;                           // 空席
      const c = cols[Math.floor(Math.random() * cols.length)], m = fog * (0.8 + Math.random() * 0.2);
      const rgb = c.map((v, i) => Math.round(v * (1 - m) + fogC[i] * m));
      const jx = x + rand(-0.06, 0.06);
      const body = proj(jx, yt + 0.72, z), head = proj(jx, yt + 1.12, z);
      crowd.push({ x: body.x, y: body.y, hy: head.y, s: body.s, c: `rgb(${rgb})`, skin: `rgb(${[200,160,125].map((v,i)=>Math.round(v*(1-m)+fogC[i]*m))})`, ph: Math.random() * 7, amp: rand(0.6, 1.2) });
    }
  }
  crowd.reverse();   // 奥から手前へ描く
  tiers.reverse();
})();
const suits = Array.from({ length: 14 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(14, 34), v: rand(8, 22), r: rand(0, 6), vr: rand(-0.8, 0.8), k: '♠♥♦♣'[Math.floor(Math.random() * 4)] }));

function slowTime() { return Math.max(1.2, 3.2 - makes * 0.1); }
function comboMult() { return Math.min(4, 1 + Math.floor((combo - 1) / 3)); }
function newBall() { return { x: REL.x, y: REL.y, z: REL.z, vx: 0, vy: 0, vz: 0, rot: 0, spin: 0, rim: false, board: false, scored: false, t: 0, floorHits: 0 }; }
function newShot() { state = 'ready'; ball = newBall(); slowUsed = false; slowLeft = 0; hoop.moved = 0; drag = null; flick = null; trail = []; }
function startGame() {
  score = 0; scoreDisp = 0; makes = 0; combo = 0; maxCombo = 0; lives = MAX_LIFE; lifeAnim = [0, 0, 0];
  st = { honest: 0, cheat: 0, moved: 0, swish: 0, bank: 0, rimIn: 0, lastLife: 0, shortMiss: 0, overMiss: 0 }; titleInfo = null;
  isNew = false; msgs = []; parts = []; hudParts = []; hoop.x = 0; hoop.y = DEF_Y; newShot();
  flash = { a: 0.6, c: GOLD };
}

function shootFromFlick(fx, fy) {
  const u = -fy;
  const v = VSTAR * (0.82 + 0.4 * clamp((u - 400) / 2600, 0, 1));
  const side = clamp(fx / Math.max(u, 1), -0.6, 0.6);
  shoot(v, side * 2.0);
}
const GUIDE_SHOTS = 5;
let shotsEver = 0, guideOn = false;
try { shotsEver = +localStorage.getItem('ikasama_ft_shots') || 0; } catch (e) {}
// ボールがゴールの奥行きを通る点（ここにゴールを置けば入る）
function guideTarget() {
  const b = ball; if (!b || b.vz <= 0 || b.z >= RIM_Z) return null;
  const t = (RIM_Z - b.z) / b.vz, y = b.y + b.vy * t - G * t * t / 2, vy = b.vy - G * t, x = b.x + b.vx * t;
  if (vy > -0.9) return null;                                // 上昇中や、ほぼ水平に通過する球は入らない
  const ty = y - 0.04;
  if (ty < HOOP_Y0 - 0.05 || ty > HOOP_Y1 + 0.05 || Math.abs(x) > HOOP_X + 0.05) return null;
  return { x: clamp(x, -HOOP_X, HOOP_X), y: clamp(ty, HOOP_Y0, HOOP_Y1) };
}
function shoot(v, vx) {
  guideOn = shotsEver < GUIDE_SHOTS; shotsEver++;
  try { localStorage.setItem('ikasama_ft_shots', shotsEver); } catch (e) {}
  Object.assign(ball, { vx, vy: v * Math.sin(ANG), vz: v * Math.cos(ANG), spin: 9 });
  state = 'fly'; SFX.shoot();
  const p = proj(ball.x, ball.y, ball.z);
  burst(p.x, p.y, 14, { colors: ['#fff', '#ffd166', GOLD], spd: [80, 260], life: [0.2, 0.45], size: [1.5, 3], kind: 'spark', ang: [-Math.PI * 0.9, -Math.PI * 0.1] });
}

function popMsg(text, kind, delay = 0) { msgs.push({ text, kind, t: -delay }); }

// ===== パーティクル =====
function burst(x, y, n, o, list = parts) {
  for (let i = 0; i < n; i++) {
    const a = o.ang ? rand(o.ang[0], o.ang[1]) : rand(0, Math.PI * 2), s = rand(o.spd[0], o.spd[1]);
    list.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(o.life[0], o.life[1]), t: 0, size: rand(o.size[0], o.size[1]),
      c: o.colors[Math.floor(Math.random() * o.colors.length)], kind: o.kind, rot: rand(0, 6), vr: rand(-12, 12), g: o.g ?? 0, drag: o.drag ?? 2 });
  }
}
function ring(x, y, c, maxR, life, w = 4, list = parts) { list.push({ x, y, kind: 'ring', c, maxR, life, t: 0, w }); }
function stepParts(list, dt) {
  for (const p of list) {
    p.t += dt;
    if (p.kind === 'ring') continue;
    p.vx *= Math.exp(-p.drag * dt); p.vy *= Math.exp(-p.drag * dt); p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  return list.filter(p => p.t < p.life);
}
function drawParts(list) {
  for (const p of list) {
    const k = p.t / p.life;
    if (p.kind === 'ring') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.c; ctx.globalAlpha = (1 - k) * 0.9; ctx.lineWidth = p.w * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.maxR * easeOut(k), 0, 7); ctx.stroke();
    } else if (p.kind === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.c; ctx.globalAlpha = 1 - k; ctx.lineWidth = p.size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
    } else if (p.kind === 'confetti') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = Math.min(1, (1 - k) * 2); ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.sin(p.rot * 1.7)) + 0.15);
      ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); ctx.restore();
    } else if (p.kind === 'glow') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.8; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k * 0.5), 0, 7); ctx.fill();
    } else if (p.kind === 'shard') {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1 - k; ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size * 0.7, p.size * 0.6); ctx.lineTo(-p.size * 0.6, p.size * 0.4); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'butt';
}

// ===== 得点・ミス =====
function onScore(b) {
  b.scored = true; b.scoreT = b.t; makes++; combo++; maxCombo = Math.max(maxCombo, combo);
  const honest = hoop.moved < 0.08, mult = comboMult(), base = honest ? 2 : 1, pts = base * mult;
  score += pts; scoreBump = 1;
  if (honest) st.honest++; else { st.cheat++; st.moved += hoop.moved; }
  if (!b.rim && !b.board) st.swish++; else if (b.board && !b.rim) st.bank++; else if (b.rim) st.rimIn++;
  if (lives === 1) st.lastLife++;
  netAnim = 1; cheer = 1; slowLeft = 0;
  hitstop = honest ? 0.16 : 0.08; punch = 1; shake = Math.max(shake, honest ? 0.9 : 0.5);
  flash = { a: honest ? 0.85 : 0.5, c: honest ? '#ffe9a8' : '#ffffff' };
  SFX.swish(); SFX.impact(); SFX.make(mult); SFX.cheer(honest ? 1.4 : 1);
  if (honest) SFX.honest();
  const p = proj(hoop.x, hoop.y, RIM_Z);
  ring(p.x, p.y, GOLD, 140, 0.5, 6); ring(p.x, p.y, '#fff', 90, 0.35, 3);
  burst(p.x, p.y, honest ? 60 : 34, { colors: ['#fff', '#ffe08a', GOLD, '#ffb347'], spd: [180, 560], life: [0.3, 0.7], size: [2, 3.5], kind: 'spark', drag: 3 });
  burst(p.x, p.y, honest ? 70 : 36, { colors: [GOLD, '#ffe08a', '#ffffff', '#2d6a4f', '#52b788', '#e76f51'], spd: [120, 420], life: [1.2, 2.0], size: [3, 6], kind: 'confetti', g: 520, drag: 2.2, ang: [-Math.PI * 0.95, -Math.PI * 0.05] });
  burst(p.x, p.y, 8, { colors: ['rgba(255,220,140,0.6)'], spd: [20, 80], life: [0.4, 0.7], size: [18, 34], kind: 'glow' });
  if (honest) ring(p.x, p.y, '#ffffff', 260, 0.8, 8);
  for (let i = 0; i < 26; i++) { const c = crowd[Math.floor(Math.random() * crowd.length)]; camFlashes.push({ x: c.x, y: c.hy, t: -rand(0, 0.8), life: 0.14 }); }

  if (honest) popMsg('AMAZING!!', 'honest');
  else if (!b.rim && !b.board) popMsg('GREAT!', 'swish');
  else if (b.board && !b.rim) popMsg('NICE!', 'make');
  else popMsg('GOOD!', 'make');
  popMsg(`+${pts}`, 'pts', 0.12);
  if (combo >= 2) popMsg(`${combo} COMBO`, 'combo', 0.2);
}
function onMiss() {
  combo = 0; lives--; lifeAnim[lives] = 0.0001;
  // 弱すぎ判定：ゴールの奥行きまで届かなかった or 一番低いゴール位置より下を通過した
  const weak = ball.crossY === undefined || ball.crossY < HOOP_Y0 + 0.1;
  if (weak) st.shortMiss++; else if (ball.z > BOARD_Z) st.overMiss++;

    ctx.font = `700 11px ${F_UI}`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(201,168,76,0.85)'; ctx.fillText('あなたの称号', W / 2, py + 206);
    ctx.font = `15px ${F_JP}`; ctx.fillStyle = '#e9d9a6'; ctx.fillText(ti.prefix, W / 2, py + 230);
    ctx.font = `28px ${F_JP}`; const fit = Math.min(1, 250 / ctx.measureText(ti.title).width);
    ctx.save(); ctx.translate(W / 2, py + 266); ctx.scale(sc * fit, sc * fit);
    bigText(ti.title, 0, 0, 28, F_JP, ti.special ? '#ffffff' : goldGrad(0, 28), { ow: 0.22, iw: 0.07, inner: ti.special ? '#ff9a3c' : '#fff6d6', glow: ti.special ? 'rgba(255,154,60,0.8)' : null });
    ctx.restore();
    // レア度
    ctx.font = `900 15px ${F_UI}`; ctx.textAlign = 'center';
    ctx.fillStyle = GOLD; ctx.fillText('★'.repeat(ti.stars) + '☆'.repeat(5 - ti.stars), W / 2, py + 292);
    ctx.font = `700 10.5px ${F_UI}`; ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`称号コレクション  ${ti.count} / ${ti.total}`, W / 2, py + 312);
    if (ti.isNewTitle && t > 1.85) {
      ctx.save(); ctx.translate(W - 62, py + 240); ctx.rotate(0.2); const ps = 1 + Math.sin(time * 9) * 0.08; ctx.scale(ps, ps);
      bigText('NEW!', 0, 0, 24, F_NUM, '#ffffff', { ow: 0.22, inner: '#ff4d6d', glow: '#ff4d6d' });
      ctx.restore();
      if (!drawOver.newT) { drawOver.newT = true; SFX.honest(); burst(W / 2, py + 266, 30, { colors: [GOLD, '#ffe08a', '#fff'], spd: [60, 260], life: [0.4, 0.8], size: [1.5, 3], kind: 'spark' }, hudParts); }
    }
  }
  ctx.globalAlpha = 1;
  if (isNew && t > 1.9) {
    if (!drawOver.rec) { drawOver.rec = true; SFX.record(); burst(W / 2, py + 108, 70, { colors: [GOLD, '#ffe08a', '#fff', '#52b788', '#e76f51'], spd: [150, 450], life: [1.2, 2], size: [3, 6], kind: 'confetti', g: 500, drag: 2 }, hudParts); ring(W / 2, py + 108, GOLD, 200, 0.6, 6, hudParts); }
    const ns = 1 + Math.sin(time * 8) * 0.05;
    ctx.save(); ctx.translate(W / 2, py + 8); ctx.rotate(-0.06); ctx.scale(ns, ns);
    bigText('NEW RECORD!', 0, 0, 30, F_NUM, '#ffffff', { ow: 0.2, inner: '#ff7b2e', glow: '#ff7b2e' });
    ctx.restore();
  }
  if (t > 1.8) {
    // もう一回ボタン
    const r = RETRY_BTN, k = easeOut((t - 1.8) / 0.25), pulse = 1 + Math.sin(time * 4) * 0.03;
    ctx.save(); ctx.translate(r.x + r.w / 2, r.y + r.h / 2); ctx.scale(k * pulse, k * pulse); ctx.translate(-r.w / 2, -r.h / 2);
    ctx.shadowColor = 'rgba(201,168,76,0.7)'; ctx.shadowBlur = 14 + Math.sin(time * 4) * 6;
    rr(0, 0, r.w, r.h, r.h / 2);
    const bg = ctx.createLinearGradient(0, 0, 0, r.h); bg.addColorStop(0, '#fff1bf'); bg.addColorStop(0.45, '#e2c06a'); bg.addColorStop(0.55, GOLD); bg.addColorStop(1, '#8a6a1f');
    ctx.fillStyle = bg; ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff6d6'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    const sx = -60 + ((time * 120) % (r.w + 160)), sg = ctx.createLinearGradient(sx - 30, 0, sx + 30, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.45)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    rr(0, 0, r.w, r.h, r.h / 2); ctx.fillStyle = sg; ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = `22px ${F_JP}`; ctx.textAlign = 'center'; ctx.fillStyle = '#1a1205'; ctx.fillText('もう一回', r.w / 2, r.h / 2 + 8);
    ctx.restore();
    drawCollButton(OVER_BTN, 12); drawPill(RANK_BTN_OVER, 12, '👑 ランキング');
  }
  // 先輩
  if (satoLine && t > 1.8) drawSato(t);
}
function drawSatochin(cx, cy, r, mouthOpen) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = '#163a2b'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = GOLD; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, 7); ctx.clip();
  const s = r / 30;
  // うしろ髪（ボブ）
  ctx.fillStyle = '#4a2c1d';
  ctx.beginPath(); ctx.ellipse(cx, cy - 1 * s, 19 * s, 21 * s, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx - 14 * s, cy + 10 * s, 7 * s, 12 * s, 0.15, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 14 * s, cy + 10 * s, 7 * s, 12 * s, -0.15, 0, 7); ctx.fill();
  // ユニフォーム
  ctx.fillStyle = '#2d6a4f'; ctx.beginPath(); ctx.ellipse(cx, cy + 31 * s, 21 * s, 12 * s, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.6 * s; ctx.beginPath(); ctx.moveTo(cx - 7 * s, cy + 20 * s); ctx.lineTo(cx, cy + 26 * s); ctx.lineTo(cx + 7 * s, cy + 20 * s); ctx.stroke();
  // 首と顔
  ctx.fillStyle = '#f1c7a6'; ctx.fillRect(cx - 4 * s, cy + 12 * s, 8 * s, 9 * s);
  ctx.fillStyle = '#f8d7bc'; ctx.beginPath(); ctx.ellipse(cx, cy + 3 * s, 13.5 * s, 14.5 * s, 0, 0, 7); ctx.fill();
  // 前髪
  ctx.fillStyle = '#4a2c1d';
  ctx.beginPath(); ctx.moveTo(cx - 15 * s, cy + 2 * s);
  ctx.quadraticCurveTo(cx - 15 * s, cy - 15 * s, cx, cy - 14 * s);
  ctx.quadraticCurveTo(cx + 15 * s, cy - 15 * s, cx + 15 * s, cy + 2 * s);
  ctx.quadraticCurveTo(cx + 9 * s, cy - 6 * s, cx + 3 * s, cy - 4 * s);
  ctx.quadraticCurveTo(cx - 2 * s, cy - 8 * s, cx - 6 * s, cy - 3 * s);
  ctx.quadraticCurveTo(cx - 11 * s, cy - 6 * s, cx - 15 * s, cy + 2 * s); ctx.fill();
  // ヘアピン
  ctx.fillStyle = GOLD; ctx.fillRect(cx + 7 * s, cy - 7 * s, 6 * s, 2 * s);
  // サングラス
  ctx.fillStyle = '#121212';
  for (const ex of [-5.6, 5.6]) { rr(cx + ex * s - 5 * s, cy + 1.2 * s, 10 * s, 6.2 * s, 2.6 * s); ctx.fill(); }
  ctx.strokeStyle = '#121212'; ctx.lineWidth = 1.4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 1 * s, cy + 2.6 * s); ctx.quadraticCurveTo(cx, cy + 1.6 * s, cx + 1 * s, cy + 2.6 * s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 10.6 * s, cy + 2.4 * s); ctx.lineTo(cx - 13.4 * s, cy + 1.4 * s); ctx.moveTo(cx + 10.6 * s, cy + 2.4 * s); ctx.lineTo(cx + 13.4 * s, cy + 1.4 * s); ctx.stroke();
  // レンズの映り込み
  ctx.fillStyle = 'rgba(201,168,76,0.75)';
  for (const ex of [-5.6, 5.6]) { ctx.beginPath(); ctx.moveTo(cx + ex * s - 3.4 * s, cy + 2.4 * s); ctx.lineTo(cx + ex * s - 1.4 * s, cy + 2.4 * s); ctx.lineTo(cx + ex * s - 3 * s, cy + 5.6 * s); ctx.lineTo(cx + ex * s - 4.2 * s, cy + 5.6 * s); ctx.fill(); }
  // 口（喋っていないときはニヤリ）
  if (mouthOpen) { ctx.fillStyle = '#a4483a'; ctx.beginPath(); ctx.ellipse(cx + 0.6 * s, cy + 11 * s, 2.4 * s, 2.2 * s, 0, 0, 7); ctx.fill(); }
  else { ctx.strokeStyle = '#8a3a2e'; ctx.lineWidth = 1.5 * s; ctx.beginPath(); ctx.moveTo(cx - 3 * s, cy + 11.4 * s); ctx.quadraticCurveTo(cx + 1 * s, cy + 12.6 * s, cx + 4 * s, cy + 9.6 * s); ctx.stroke(); }
  ctx.lineCap = 'butt';
  ctx.restore();
}
function drawSato(t) {
  const L = satoLayout(), r = satoBubbleRect();
  // 画面に入ってきたら喋りはじめる
  if (!talk && SATO_Y - resultScroll < H - 20) talk = { i: 0, n: [...satoLine].length, acc: 0 };
  ctx.font = `900 11px ${F_UI}`; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(201,168,76,0.7)';
  ctx.fillText('— 先輩からのアドバイス —', 22, SATO_Y - 14);
  const talking = talk && talk.i < talk.n;
  drawSatochin(52, SATO_Y + 30, 30, talking && Math.floor(talk.i / 2) % 2 === 0);
  // 吹き出し
  rr(r.x, r.y, r.w, r.h, 14); ctx.fillStyle = '#fbf3df'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(r.x, r.y + 20); ctx.lineTo(r.x - 8, r.y + 27); ctx.lineTo(r.x, r.y + 34); ctx.closePath(); ctx.fill();
  ctx.font = `900 10px ${F_UI}`; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(27,67,50,0.55)'; ctx.fillText('先輩', r.x + 12, r.y + 18);
  ctx.font = SATO_FONT(); ctx.fillStyle = GREEN;
  let left = talk ? Math.floor(talk.i) : 0;
  L.lines.forEach((ln, i) => {
    if (left <= 0) return;
    const chars = [...ln], show = chars.slice(0, left).join(''); left -= chars.length;
    ctx.fillText(show, r.x + 12, r.y + 38 + i * SATO_LH);
  });
  // キャレット
  if (talk && Math.floor(time * 2) % 2 === 0) {
    let n = Math.floor(talk.i), li = 0;
    while (li < L.lines.length - 1 && n > [...L.lines[li]].length) { n -= [...L.lines[li]].length; li++; }
    const cx = r.x + 12 + ctx.measureText([...L.lines[li]].slice(0, n).join('')).width + 2;
    ctx.fillStyle = 'rgba(27,67,50,0.6)'; ctx.fillRect(cx, r.y + 27 + li * SATO_LH, 6, 13);
  }
}

// ===== メイン描画 =====
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const slowK = clamp((1 - tScale) / (1 - SLOW_SCALE), 0, 1);
  // カメラ（ズーム＋揺れ）
  const hp = proj(hoop.x, hoop.y, RIM_Z);
  const z = 1 + 0.06 * slowK + 0.08 * punch;
  const cx = W / 2 + (hp.x - W / 2) * (0.5 * slowK + punch * 0.5), cy = H * 0.42 + (hp.y - H * 0.42) * 0.4 * Math.max(slowK, punch);
  camCX = cx; camCY = cy; camZ = z;
  ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  ctx.translate((Math.random() - 0.5) * shake * 7, (Math.random() - 0.5) * shake * 7);

  drawArena();
  const b = ball || newBall();
  const behindBoard = b.z > BOARD_Z;
  if (behindBoard) { drawShadow(b); drawBall(b, slowK); }
  drawSpotlights();
  drawHoopBack(b, slowK);
  rim(false); net(false);
  if (!behindBoard) drawShadow(b);
  const nearHoop = !behindBoard && b.z > RIM_Z - RIM_R * 0.6 && b.y < hoop.y + 0.12;
  if (nearHoop) drawBall(b, slowK);
  net(true); rim(true);
  if (!behindBoard && !nearHoop && state !== 'title' && !(state === 'collection' && collFrom === 'title') && !(state === 'ranking' && rankFrom === 'title')) drawBall(b, slowK);
  drawParts(parts);

  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawSlowFX(slowK); drawDepthGuides(slowK); drawShotGuide(slowK); drawDragArrows();
  if (flash.a > 0) { ctx.globalCompositeOperation = flash.c === '#ff2a2a' ? 'source-over' : 'lighter'; ctx.globalAlpha = flash.a * (flash.c === '#ff2a2a' ? 0.5 : 0.8); ctx.fillStyle = flash.c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (fontsReady && state !== 'title' && state !== 'collection' && state !== 'ranking') { drawReadyHint(); drawCutIn(); drawMsgs(); drawHUD(); }
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver(); else if (state !== 'collection' && state !== 'ranking') { drawOver.rec = false; drawOver.newT = false; }
  if (state === 'collection') drawCollection();
  if (state === 'ranking') drawRanking();
  drawParts(hudParts);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
